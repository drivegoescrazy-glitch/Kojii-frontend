name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare prerelease APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kojii-frontend-prerelease.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kojii-frontend-debug
          path: kojii-frontend-prerelease.apk
          if-no-files-found: error
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ github.run_number }}-${{ github.run_attempt }}
          name: Kojii Frontend Prerelease ${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          generate_release_notes: true
          files: kojii-frontend-prerelease.apk
